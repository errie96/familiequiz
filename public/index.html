<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familiequiz - Speler</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="card">
    
    <!-- 1. Login / Meedoen scherm -->
    <div id="join-screen">
      <h1>Familiequiz 🏆</h1>
      <p style="text-align:center; margin-bottom:16px;">Vul je naam in om mee te doen:</p>
      <input type="text" id="username" placeholder="Bijv. Mark of Team Rood" maxlength="20">
      <button class="btn-primary" id="join-btn">Klaar voor de start</button>
    </div>

    <!-- 2. Wachtkamer / Lobby -->
    <div id="lobby-screen" class="hidden">
      <h2>Welkom, <span id="display-name"></span>!</h2>
      <p style="text-align:center; color:#94a3b8; margin-top:20px;">Wachten tot de quizmaster de ronde start...</p>
    </div>

    <!-- 3. Vraag beantwoord / Vraag actief -->
    <div id="question-screen" class="hidden">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span class="badge" id="player-round-badge">Ronde</span>
        <span class="badge" id="player-timer-badge">⏱️ --s</span>
      </div>
      <h3 id="player-question-text">Vraag laadt...</h3>

      <div id="media-container"></div>
      <div id="options-container"></div>

      <button id="submit-btn" class="btn-primary hidden" style="margin-top: 16px; background: #22c55e;">
        Antwoord Indienen 📤
      </button>

      <p id="feedback-text" class="hidden" style="text-align:center; margin-top:15px; color:#38bdf8; font-weight:bold;">
        ✅ Ingediend! Wachten tot iedereen heeft ingediend...
      </p>
    </div>

    <!-- 4. Pauzescherm -->
    <div id="pause-screen" class="hidden" style="text-align: center;">
      <h2>☕ Pauze!</h2>
      <p>Even pauze voor eten en drinken.</p>
    </div>

  </div>

  <script>
    const socket = io();
    let playerId = localStorage.getItem("quiz_player_id") || null;
    let playerName = localStorage.getItem("quiz_player_name") || "";
    let selectedOptionIndex = null;
    let hasSubmittedCurrent = false;

    // Anti-spiek detectie
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && playerId) {
        socket.emit("player_blurred", { playerId });
      }
    });
    window.addEventListener("blur", () => {
      if (playerId) {
        socket.emit("player_blurred", { playerId });
      }
    });

    // Automatisch herstellen bij verbinden of vernieuwen
    socket.on("connect", () => {
      if (playerId && playerName) {
        socket.emit("init_player", { playerId, name: playerName });
      }
    });

    // Inlogknop
    document.getElementById("join-btn").addEventListener("click", () => {
      const name = document.getElementById("username").value.trim();
      if (name) {
        socket.emit("init_player", { playerId: null, name });
      }
    });

    // Nieuw ingelogd
    socket.on("joined", (data) => {
      playerId = data.playerId;
      playerName = data.name;
      localStorage.setItem("quiz_player_id", playerId);
      localStorage.setItem("quiz_player_name", playerName);
      showLobby();
    });

    // Sessie hersteld na vernieuwen
    socket.on("session_restored", (data) => {
      playerId = data.playerId;
      playerName = data.name;
      hasSubmittedCurrent = data.answered;
      showLobby();
    });

    function showLobby() {
      document.getElementById("display-name").textContent = playerName;
      document.getElementById("join-screen").classList.add("hidden");
      document.getElementById("lobby-screen").classList.remove("hidden");
    }

    // Antwoord indienen
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.addEventListener("click", () => {
      if (selectedOptionIndex !== null && !hasSubmittedCurrent) {
        hasSubmittedCurrent = true;
        socket.emit("submit_answer", { playerId, answerIndex: selectedOptionIndex });
        submitBtn.classList.add("hidden");
        const options = document.getElementById("options-container").children;
        Array.from(options).forEach(b => b.disabled = true);
        document.getElementById("feedback-text").classList.remove("hidden");
      }
    });

    // State synchronisatie
    socket.on("state_update", (state) => {
      if (!playerId) return;

      if (state.gameState === "PAUSED") {
        document.getElementById("question-screen").classList.add("hidden");
        document.getElementById("lobby-screen").classList.add("hidden");
        document.getElementById("pause-screen").classList.remove("hidden");
        return;
      } else {
        document.getElementById("pause-screen").classList.add("hidden");
      }

      if (state.gameState === "QUESTION" && state.currentQuestion) {
        document.getElementById("lobby-screen").classList.add("hidden");
        document.getElementById("question-screen").classList.remove("hidden");

        document.getElementById("player-round-badge").textContent = state.roundName;
        document.getElementById("player-question-text").textContent = state.currentQuestion.question;

        // Kijk of speler volgens server al heeft ingediend
        const me = state.playerList.find(p => p.playerId === playerId);
        if (me && me.answered) {
          hasSubmittedCurrent = true;
          submitBtn.classList.add("hidden");
          document.getElementById("feedback-text").classList.remove("hidden");
        } else {
          hasSubmittedCurrent = false;
          document.getElementById("feedback-text").classList.add("hidden");
        }

        // Opties opbouwen
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        state.currentQuestion.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = "btn-option";
          btn.textContent = `${['A', 'B', 'C', 'D'][idx]}: ${opt}`;
          if (hasSubmittedCurrent) btn.disabled = true;

          btn.onclick = () => {
            if (hasSubmittedCurrent) return;
            selectedOptionIndex = idx;
            Array.from(optionsContainer.children).forEach(b => b.style.background = "#334155");
            btn.style.background = "#2563eb";
            submitBtn.classList.remove("hidden");
          };
          optionsContainer.appendChild(btn);
        });

      } else if (state.gameState === "SCOREBOARD" || state.gameState === "LOBBY") {
        selectedOptionIndex = null;
        hasSubmittedCurrent = false;
        document.getElementById("question-screen").classList.add("hidden");
        document.getElementById("lobby-screen").classList.remove("hidden");
      }
    });

    socket.on("timer_tick", (data) => {
      document.getElementById("player-timer-badge").textContent = `⏱️ ${data.timeLeft}s`;
    });
  </script>
</body>
</html>
