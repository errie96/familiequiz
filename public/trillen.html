<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familiequiz – trillen testen</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #94a3b8; margin: 0 0 14px; font-size: 14px; }
    button { display: block; width: 100%; margin: 8px 0; padding: 16px; font-size: 18px; font-weight: bold; border: 0; border-radius: 12px; background: #2563eb; color: #fff; }
    #log { margin-top: 16px; background: #1e293b; border-radius: 10px; padding: 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>📳 Trillen testen</h1>
  <p>Zet Niet storen uit. Tik op elke knop en onthoud welke trillen. Maak daarna een screenshot van het logboek onderaan.</p>
  <button data-t="1000">1. Eén seconde (getal)</button>
  <button data-t="[1000]">2. Eén seconde (lijst)</button>
  <button data-t="200">3. Kort, 0,2 seconde</button>
  <button data-t="[200,150,200,150,200]">4. Patroon: drie keer kort</button>
  <button data-t="60">5. Heel kort, 60 ms (zoals in de quiz)</button>
  <button data-t="5000">6. Lang: vijf seconden in één keer</button>
  <button id="loop" style="background:#16a34a;">7. Doorlopend: elke seconde opnieuw, 5 seconden</button>
  <button id="double" style="background:#16a34a;">8. Twee keer kort na elkaar (opwarmen)</button>
  <button id="ls300" style="background:#9333ea;">9. Lang starten, na 0,3 s stoppen</button>
  <button id="ls150" style="background:#9333ea;">10. Lang starten, na 0,15 s stoppen</button>
  <button id="ls3x" style="background:#9333ea;">11. Drie korte tikken (zoals de quiz nu doet)</button>
  <button id="stop" style="background:#dc2626;">⏹ Stop</button>
  <div id="log"></div>
  <script>
    const log = (t) => { document.getElementById("log").textContent += t + "\n"; };
    log("Browser: " + navigator.userAgent);
    log("Vibration API: " + (typeof navigator.vibrate === "function" ? "ja" : "nee") + " · veilige verbinding: " + (window.isSecureContext ? "ja" : "nee") + " · zichtbaar: " + document.visibilityState);
    let loopTimer = null;
    const stop = () => { clearInterval(loopTimer); loopTimer = null; navigator.vibrate(0); };
    document.getElementById("stop").onclick = () => { stop(); log("⏹ gestopt"); };
    document.getElementById("loop").onclick = () => {
      stop();
      let n = 0;
      const once = () => { const r = navigator.vibrate(1000); log("7: doorlopend, keer " + (++n) + ": " + r); if (n >= 5) { clearInterval(loopTimer); loopTimer = null; } };
      once(); loopTimer = setInterval(once, 1000);
    };
    const longStop = (ms, tag) => { const r = navigator.vibrate(5000); setTimeout(() => navigator.vibrate(0), ms); log(tag + ": lang gestart (" + r + "), stop na " + ms + " ms"); };
    document.getElementById("ls300").onclick = () => { stop(); longStop(300, "9"); };
    document.getElementById("ls150").onclick = () => { stop(); longStop(150, "10"); };
    document.getElementById("ls3x").onclick = () => { stop(); [0, 300, 600].forEach((t) => setTimeout(() => longStop(150, "11"), t)); };
    document.getElementById("double").onclick = () => {
      stop();
      const r1 = navigator.vibrate(300);
      setTimeout(() => { const r2 = navigator.vibrate(300); log("8: twee keer: " + r1 + " / " + r2); }, 80);
    };
    document.querySelectorAll("button[data-t]").forEach((b) => b.addEventListener("click", () => {
      const arg = JSON.parse(b.dataset.t);
      let r;
      try { r = navigator.vibrate(arg); } catch (e) { r = "fout: " + e.message; }
      const act = navigator.userActivation ? (navigator.userActivation.isActive ? "actief" : "niet actief") : "?";
      log(b.textContent.split(".")[0] + ": vibrate(" + JSON.stringify(arg) + ") gaf " + r + " · tik: " + act);
    }));
  </script>
</body>
</html>
