<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Familiequiz - De Grote Ontknoping</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="shared.js"></script>
</head>
<body style="max-width: 850px; margin: 0 auto; padding: 24px; min-height: 100vh;">
  <div class="card" style="max-width: 100%; text-align: center;">

    <h1 style="font-size: 38px; margin-bottom: 8px;">🏆 De Einduitslag 🏆</h1>
    <p id="round-indicator" style="color: #94a3b8; margin-bottom: 24px; font-size: 18px;">De uitslag is nog geheim tot de quizmaster op start drukt!</p>

    <!-- Startknop voor de spannende onthulling -->
    <div id="reveal-controls" class="hidden" style="margin-bottom: 24px;">
      <button id="btn-start-reveal" class="btn-primary" style="background: linear-gradient(135deg, #f59e0b, #ef4444); font-size: 20px; padding: 14px 28px; width: auto; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);">
        🎬 Start Ontknoping (Slechtste ➔ Beste)
      </button>
    </div>

    <!-- Hier verschijnen de teams één voor één -->
    <ul id="scoreboard-table" style="text-align: left; font-size: 20px; min-height: 120px;"></ul>

    <!-- Winnaarsbanner -->
    <div id="winner-banner" class="hidden" style="margin-top: 24px; padding: 24px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 12px; color: white; animation: pulse 1s infinite alternate; box-shadow: 0 10px 30px rgba(245, 158, 11, 0.6);">
      <h2 style="font-size: 32px; margin: 0;">🎉 GEFELICITEERD! 🎉</h2>
      <p id="winner-name-text" style="font-size: 26px; font-weight: bold; margin-top: 8px;">TEAM</p>
    </div>

  </div>

  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);

    let finalScoresData = [];
    let revealStatus = "idle"; // idle | running | done
    let cancelReveal = null;

    // Zelfde pincode als de host-pagina; anders kunnen spelers de uitslag meelezen
    function registerScoreboard() {
      let pin = localStorage.getItem("quiz_host_pin");
      if (!pin) {
        pin = (prompt("Pincode (staat in de console van de server):") || "").trim();
        if (pin) localStorage.setItem("quiz_host_pin", pin);
      }
      if (pin) socket.emit("register_scoreboard", { pin });
    }
    socket.on("connect", registerScoreboard);
    socket.on("auth_denied", () => {
      localStorage.removeItem("quiz_host_pin");
      alert("Onjuiste pincode.");
      registerScoreboard();
    });

    function resetDisplay() {
      if (cancelReveal) cancelReveal();
      cancelReveal = null;
      revealStatus = "idle";
      finalScoresData = [];
      $("round-indicator").textContent = "De antwoorden en scores blijven geheim tot het einde van de quiz!";
      $("reveal-controls").classList.add("hidden");
      $("scoreboard-table").replaceChildren();
      $("winner-banner").classList.add("hidden");
    }

    socket.on("state_update", (state) => {
      if (state.gameState === "END") {
        finalScoresData = state.finalScores || [];
        if (revealStatus === "idle") {
          $("round-indicator").textContent = "Alle rondes zijn voltooid! Druk hieronder om de ranglijst te onthullen.";
          $("reveal-controls").classList.remove("hidden");
        }
      } else if (state.gameState !== "REVIEW") {
        resetDisplay();
      }
    });

    $("btn-start-reveal").addEventListener("click", () => {
      if (revealStatus !== "idle" || finalScoresData.length === 0) return;
      revealStatus = "running";
      $("reveal-controls").classList.add("hidden");
      cancelReveal = QuizFX.runReveal(finalScoresData, {
        table: $("scoreboard-table"),
        banner: $("winner-banner"),
        winnerText: $("winner-name-text"),
        onFinish: () => { revealStatus = "done"; }
      });
    });
  </script>
</body>
</html>
