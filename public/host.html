<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Familiequiz - Host Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body style="max-width: 900px; margin: 0 auto; padding: 20px;">
  <div class="card" style="max-width: 100%;">
    
    <!-- Bediening -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 16px; margin-bottom: 20px;">
      <div>
        <h1 style="text-align: left; margin: 0;">Quiz Master Regie</h1>
        <small id="connection-status" style="color: #4ade80;">● Verbonden als Host</small>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="btn-pause" class="btn-pause" style="width: auto; padding: 10px 18px; margin: 0;">☕ Pauzeer</button>
        <button id="btn-next" class="btn-primary" style="width: auto; padding: 10px 22px; margin: 0;">Start / Volgende ➡️</button>
      </div>
    </div>

    <!-- Live Spiekwaarschuwingen met Alarm -->
    <div id="cheat-alerts"></div>

    <!-- QR Code & Deelnemen -->
    <div id="lobby-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
      <h2>Laat de familie scannen om mee te doen 📱</h2>
      <p style="color: #94a3b8; margin-bottom: 12px;">Link: <b id="join-url-text" style="color:#38bdf8;"></b></p>
      <div id="qrcode" style="background: white; padding: 12px; border-radius: 8px;"></div>
    </div>

    <!-- Vraagweergave -->
    <div id="host-main-view">
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
        <span class="badge" id="host-round-title">Familiequiz</span>
        <span class="badge" id="host-timer" style="background: #2563eb;">⏱️ 0s</span>
      </div>

      <h2 id="host-question" style="font-size: 24px; min-height: 40px; margin: 15px 0;">Wachten op de start...</h2>
      <div id="host-media" style="text-align: center; margin: 15px 0;"></div>
      <div id="host-options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
    </div>

    <hr style="border-color: #334155; margin: 24px 0;">

    <!-- Deelnemersstatus (Geen scores) -->
    <div>
      <h3>Deelnemers & Status (<span id="player-count">0</span>)</h3>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">Het scorebord draait apart op <a href="/scoreboard.html" target="_blank" style="color:#38bdf8;">/scoreboard.html</a></p>
      <ul id="players-status-list"></ul>
    </div>

  </div>

  <script>
    const socket = io();

    // 1. Host Token ophalen of instellen voor herstel bij F5
    let hostToken = localStorage.getItem("quiz_host_token");
    if (!hostToken) {
      hostToken = "host_" + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("quiz_host_token", hostToken);
    }

    // 2. QR Code genereren
    const joinUrl = window.location.origin;
    document.getElementById("join-url-text").textContent = joinUrl;
    new QRCode(document.getElementById("qrcode"), {
      text: joinUrl,
      width: 160,
      height: 160,
      colorDark: "#0f172a",
      colorLight: "#ffffff"
    });

    // 3. Audio alarmtoon voor spiekdetectie
    function playAlarmSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    // 4. Verbinding & F5 herstel
    socket.on("connect", () => {
      document.getElementById("connection-status").textContent = "● Verbonden als Host";
      document.getElementById("connection-status").style.color = "#4ade80";
      socket.emit("register_host", { token: hostToken });
    });

    socket.on("disconnect", () => {
      document.getElementById("connection-status").textContent = "○ Verbinding verbroken...";
      document.getElementById("connection-status").style.color = "#ef4444";
    });

    socket.on("host_confirmed", (data) => {
      if (data.token) {
        localStorage.setItem("quiz_host_token", data.token);
      }
    });

    // 5. Knoppen
    const btnNext = document.getElementById("btn-next");
    const btnPause = document.getElementById("btn-pause");

    btnNext.addEventListener("click", () => socket.emit("next_question"));
    btnPause.addEventListener("click", () => socket.emit("toggle_pause"));

    // 6. Direct spiekalarm
    socket.on("cheat_warning", (data) => {
      playAlarmSound();

      const container = document.getElementById("cheat-alerts");
      const alert = document.createElement("div");
      alert.className = "alert-box";
      alert.style.backgroundColor = "#dc2626";
      alert.style.border = "2px solid #f87171";
      alert.innerHTML = `🚨 <b>SPIEKALARM:</b> <u>${data.playerName}</u> verliet zojuist de quiz om ${data.timestamp}!`;
      container.prepend(alert);

      setTimeout(() => {
        alert.style.transition = "opacity 0.5s ease";
        alert.style.opacity = "0";
        setTimeout(() => alert.remove(), 500);
      }, 9000);
    });

    // 7. State sync
    socket.on("state_update", (state) => {
      document.getElementById("host-round-title").textContent = state.roundName || "Familiequiz";

      const mediaBox = document.getElementById("host-media");
      const optionsBox = document.getElementById("host-options");
      const lobbyBox = document.getElementById("lobby-container");

      if (state.gameState === "LOBBY") {
        lobbyBox.classList.remove("hidden");
        btnNext.textContent = "Start Quiz 🚀";
      } else {
        lobbyBox.classList.add("hidden");
        btnNext.textContent = "Volgende Vraag ➡️";
      }

      if (state.gameState === "PAUSED") {
        document.getElementById("host-question").textContent = "☕ PAUZE (Eten / Drinken)";
        btnPause.textContent = "▶️ Hervat Quiz";
        btnPause.style.background = "#22c55e";
        return;
      } else {
        btnPause.textContent = "☕ Pauzeer";
        btnPause.style.background = "#f59e0b";
      }

      if (state.gameState === "QUESTION" && state.currentQuestion) {
        document.getElementById("host-question").textContent = state.currentQuestion.question;
        mediaBox.innerHTML = "";
        optionsBox.innerHTML = "";

        if (state.currentQuestion.type === "location" && state.currentQuestion.imageUrl) {
          mediaBox.innerHTML = `<img src="${state.currentQuestion.imageUrl}" style="max-height: 250px; border-radius: 8px;">`;
        }
        if (state.currentQuestion.type === "audio" && state.currentQuestion.audioUrl) {
          mediaBox.innerHTML = `<audio controls autoplay src="${state.currentQuestion.audioUrl}"></audio>`;
        }

        state.currentQuestion.options.forEach((opt, idx) => {
          const div = document.createElement("div");
          div.className = "btn-option";
          div.style.padding = "10px";
          div.textContent = `${['A', 'B', 'C', 'D'][idx]}: ${opt}`;
          optionsBox.appendChild(div);
        });
      }

      renderPlayerStatuses(state.playerList, state.gameState);
    });

    socket.on("timer_tick", (data) => {
      document.getElementById("host-timer").textContent = `⏱️ ${data.timeLeft}s`;
    });

    socket.on("show_results", (data) => {
      if (data.correctAnswer !== null) {
        document.getElementById("host-question").textContent = `Juiste antwoord: Optie ${['A', 'B', 'C', 'D'][data.correctAnswer]}! ✅`;
      }
    });

    function renderPlayerStatuses(list, gameState) {
      document.getElementById("player-count").textContent = list.length;
      const listEl = document.getElementById("players-status-list");
      listEl.innerHTML = "";

      list.forEach(p => {
        const li = document.createElement("li");
        let statusBadge = "";

        if (!p.connected) {
          statusBadge = `<span style="color:#94a3b8;">(offline)</span>`;
        } else if (gameState === "QUESTION") {
          statusBadge = p.answered 
            ? `<span style="color:#4ade80; font-weight:bold;">✓ Ingediend</span>` 
            : `<span style="color:#f59e0b;">⏳ Bezig met kiezen</span>`;
        } else {
          statusBadge = `<span style="color:#38bdf8;">Klaar</span>`;
        }

        li.innerHTML = `<span>${p.name}</span>${statusBadge}`;
        listEl.appendChild(li);
      });
    }
  </script>
</body>
</html>
